{% extends 'base.html' %}

{% block title %}Register - GenAI Health{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card p-4 mt-5">
            <h2 class="text-center fw-bold mb-4">Register</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field.errors }}
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" placeholder="Enter {{ field.label }}">
                        {% if field.help_text %}
                            <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
            </form>
            <div class="text-center mt-4">
                <p>Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
